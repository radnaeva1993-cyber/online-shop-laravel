services:
  nginx:
    image: nginx
    ports:
    - 82:80
    volumes:
    - ./Docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    - ./:/var/www/html
    depends_on:
      - php-fpm
      - db

  php-fpm:
    build: ./Docker
    volumes:
      - ./:/var/www/html
    restart: always

  db:
    ports:
    - 5433:5432
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: dolgor
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: mydb

